services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: credit_risk_api
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000 --workers 2
    ports:
      - "8000:8000"
    volumes:
      - ./api:/app/api:ro
      - ./models:/app/models:ro
      - ./src:/app/src:ro
      - ./config:/app/config:ro
    environment:
      - PYTHONUNBUFFERED=1
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: credit_risk_dashboard
    command: streamlit run dashboard/app.py --server.port 8501 --server.address 0.0.0.0
    ports:
      - "8501:8501"
    volumes:
      - ./dashboard:/app/dashboard
      - ./src:/app/src:ro
      - ./config:/app/config:ro
      - ./models:/app/models:ro
      - ./reports:/app/reports:ro
      - ./data/processed/test_summary.parquet:/app/data/processed/test_summary.parquet:ro
      - ./.streamlit:/app/.streamlit:ro
    environment:
      - PYTHONUNBUFFERED=1
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
